# Supabase Project Configuration

[functions]

# -------------------------
# create-checkout-session
# -------------------------
# verify_jwt = true: this function requires a real authenticated Supabase
# user (see supabaseClient.auth.getUser() in index.ts, which resolves the
# GeoRanks user id — never trust a client-supplied userId).
[functions.create-checkout-session]
verify_jwt = true
import_map = "./functions/create-checkout-session/deno.json"
entrypoint = "./functions/create-checkout-session/index.ts"

# -------------------------
# stripe-webhook
# -------------------------
[functions.stripe-webhook]
verify_jwt = false
import_map = "./functions/stripe-webhook/deno.json"
entrypoint = "./functions/stripe-webhook/index.ts"

# -------------------------
# create-portal-session
# -------------------------
# verify_jwt = true: gateway defense-in-depth alongside the existing
# supabaseClient.auth.getUser() check already in index.ts.
[functions.create-portal-session]
verify_jwt = true
import_map = "./functions/create-portal-session/deno.json"
entrypoint = "./functions/create-portal-session/index.ts"
