<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful — GeoRanks</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/game-modes.css" />
  <link rel="stylesheet" href="css/home.css" />

  <style>
    .success-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .success-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      padding: 3rem 2rem;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .success-icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: bounce 1s ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .success-card h1 {
      font-size: 2.5rem;
      color: #28a745;
      margin-bottom: 1rem;
    }

    .success-card p {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .session-info {
      background: rgba(13, 49, 90, 0.05);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: #666;
    }

    .btn-home {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: linear-gradient(90deg, #0d315a, #1a4d8f);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      margin: 0.5rem;
    }

    .btn-home:hover {
      background: linear-gradient(90deg, #1a4d8f, #0d315a);
      transform: scale(1.05);
    }

    .btn-secondary {
      background: linear-gradient(90deg, #6c757d, #5a6268);
    }

    .btn-secondary:hover {
      background: linear-gradient(90deg, #5a6268, #6c757d);
    }
  </style>
</head>

<body>

<!-- Glass Header -->
<header class="home-glass-header">
  <div class="logo-header">
    <a href="index.html" class="logo-link">
      <img src="assets/logo.png" alt="GeoRanks Logo" />
    </a>
  </div>
</header>

<!-- Success Content -->
<main class="success-wrapper">
  <div class="success-card">
    <div class="success-icon">🎉</div>
    <h1>Payment Successful!</h1>
    <p>
      Thank you for upgrading to GeoRanks Premium! Your payment has been processed successfully.
    </p>
    <p>
      You now have access to all premium features including unlimited categories, 
      advanced statistics, and an ad-free experience.
    </p>
    
    <div class="session-info" id="sessionInfo">
      <strong>Session ID:</strong> <span id="sessionId">Loading...</span>
    </div>

    <div>
      <a href="index.html" class="btn-home">🏠 Back to Home</a>
      <a href="account.html" class="btn-home btn-secondary">👤 View Account</a>
    </div>
  </div>
</main>

<script>
  // Get session ID from URL parameters
  const urlParams = new URLSearchParams(window.location.search);
  const sessionId = urlParams.get('session_id');
  
  if (sessionId) {
    document.getElementById('sessionId').textContent = sessionId;
  } else {
    document.getElementById('sessionInfo').style.display = 'none';
  }

  // Optional: You can verify the session with your backend here
  // and update the user's premium status in your database
</script>

</body>
</html>
